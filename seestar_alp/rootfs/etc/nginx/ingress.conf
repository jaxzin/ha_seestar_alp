# Home Assistant ingress -> SSC web UI.
#
# Only the Supervisor's ingress proxy (172.30.32.2) may connect. It authenticates
# the user and sets X-Ingress-Path itself, so the prefix forwarded to SSC as
# X-Forwarded-Prefix cannot be spoofed by a client.
daemon off;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    # SSC's imports (FITS headers, schedules) and the support bundle form.
    client_max_body_size 64m;

    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:5432;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;
            # Live view (MJPEG) and status (server-sent events) are endless
            # streams: pass them through as they arrive, never time them out.
            proxy_buffering off;
            proxy_read_timeout 1d;
        }
    }
}
